name: water_delivery_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.3.0
  google_maps_flutter: ^2.9.0
  get: ^4.6.6
  firebase_crashlytics: ^4.1.0
  firebase_ui_auth: ^1.15.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  shared_preferences: ^2.0.6
  google_sign_in: ^6.2.1
  geolocator: ^13.0.1
  url_launcher: ^6.3.0
  flutter_rating_bar: ^4.0.1
  connectivity_plus: ^6.1.4
  permission_handler: ^11.3.1

  firebase_messaging: ^15.1.3
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1
  http: ^1.2.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/NabaaIcon.png" # تأكد من أن الصورة موجودة في هذا المسار
  adaptive_icon_background: "#FFFFFF"  # 设置适应图标的背景颜色
  adaptive_icon_foreground: "assets/images/NabaaIcon.png"  # 设置前景图标（主图标）
  min_sdk_android: 23

flutter_native_splash:
  color: "#FFFFFF"  # Set your desired blue color (hex format)

  android: true
  ios: true
  fullscreen: true
flutter:
  generate: true
  uses-material-design: true

  assets:
    - lib/l10n/app_ar.arb
    - lib/l10n/app_en.arb
    - assets/images/

  # Fonts
  fonts:
    - family: Kufam
      fonts:
        - asset: assets/fonts/Kufam-Italic-VariableFont_wght.ttf
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Regular.ttf
